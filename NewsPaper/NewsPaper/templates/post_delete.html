{% extends 'flatpages/default.html' %}

{% block title %}Удаление{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h1 class="card-title text-danger">Удаление</h1>
            <p>Вы уверены, что хотите удалить новость <strong>{{ post.title|censor }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'news_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
