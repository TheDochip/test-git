{% extends 'flatpages/default.html' %}
{% load socialaccount %}

{% block title %}Вход{% endblock %}

{% block content %}
<h2>Вход</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>

<hr>
<p>
    <a href="{% provider_login_url 'google' %}">Войти через Google</a>
</p>
<p>
    <a href="{% url 'account_signup' %}">Регистрация</a>
</p>
{% endblock %}
