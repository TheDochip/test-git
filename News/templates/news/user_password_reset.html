{% extends 'base.html' %}

{% block title %}Восстановление пароля — Vibes{% endblock %}

{% block content %}
<div class="narrow">
    <header class="narrow-head">
        <h1 class="narrow-title">Восстановление пароля</h1>
        <p class="narrow-text">Укажите email из профиля, и мы пришлём ссылку для нового пароля.</p>
    </header>

    <form method="post" class="form">
        {% csrf_token %}
        {% include 'news/_form_fields.html' %}
        <button type="submit" class="button button--block">Прислать ссылку</button>
    </form>

    <div class="narrow-footer">
        <a href="{% url 'login' %}" class="link">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
