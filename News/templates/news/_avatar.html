{# Аватар пользователя: картинка из профиля или первая буква имени. Параметры: person, large #}
<span class="avatar{% if large %} avatar--large{% endif %}" aria-hidden="true">
    {% if person.profile.avatar %}
        <img src="{{ person.profile.avatar.url }}" alt="" loading="lazy">
    {% else %}
        {{ person.username|first|upper }}
    {% endif %}
</span>
