{% extends 'base.html' %}

{% block title %}Проверьте почту — Vibes{% endblock %}

{% block content %}
<div class="narrow">
    <header class="narrow-head">
        <h1 class="narrow-title">Проверьте почту</h1>
        <p class="narrow-text">
            Если этот email привязан к аккаунту, в письме будет ссылка для нового пароля.
            Письмо может прийти через пару минут или попасть в «Спам».
        </p>
    </header>

    <a href="{% url 'login' %}" class="button button--ghost">Вернуться ко входу</a>
</div>
{% endblock %}
