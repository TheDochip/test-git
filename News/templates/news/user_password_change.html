{% extends 'base.html' %}

{% block title %}Смена пароля — Vibes{% endblock %}

{% block content %}
<div class="narrow">
    <header class="narrow-head">
        <h1 class="narrow-title">Смена пароля</h1>
    </header>

    <form method="post" class="form">
        {% csrf_token %}
        {% include 'news/_form_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="button">Сменить пароль</button>
            <a href="{% url 'profile' user.username %}" class="button button--ghost">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
